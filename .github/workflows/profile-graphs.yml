# Regenerates the contribution graphs embedded in README.md once a day.
name: Profile graphs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D isometric contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Radar counts including private repos
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 .github/scripts/real_counts.py profile-3d-contrib

      - name: Remove star/fork counts
        run: python3 .github/scripts/trim_3d.py profile-3d-contrib

      # Snake eating the contribution grid -> dist/*.svg
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Commit graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib dist
          git diff --cached --quiet || git commit -m "Update profile graphs"
          git push
